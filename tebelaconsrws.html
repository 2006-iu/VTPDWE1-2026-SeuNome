<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praticando - Tabelas com Dados Reais</title>
    <link rel="icon" type="image/png" href="tabela-de-edicao.png">

    <style>
        table, 
        td {
            border: 1px solid red;
        }
        td{
            padding: 30px 60px;
            text-align: center
        }
        </style>
</head>
<body>
    <h1>Página 2 - Tabelas com colspan e rowspan</h1>

    <table>
        <caption> Tabela com colspan</caption>

        <tr>
            <td colspan = "3">Colspan</td>
        </tr>
        <tr>
            <td>-</td>
            <td>-</td>
            <td>-</td>
        </tr>
    </table>
<br>
    <table>
        <caption> Tabela com rowspan</caption>
        <tr>
            <td>-</td>
            <td rowspan = "3">Rowspan</td>
        </tr>

        <tr>
            <td>-</td>
        </tr>
        <tr>
            <td>-</td>  
        </tr>
    </table>

<br>
       <table>
    <caption>Tabela com colspan e rowspan</caption>

    <tr>
        <td colspan="2">Colspan</td>
        <td>-</td>
        <td rowspan="3">Rowspan</td>
    </tr>

    <tr>
        <td>-</td>
        <td>-</td>
        <td>-</td>
    </tr>

    <tr>
        <td>-</td>
        <td colspan="2">Colspan</td>
    </tr>

    <tr>
        <td>-</td>
        <td>-</td>
        <td>-</td>
        <td>-</td>
    </tr>

</table>

<a href="index.html">Voltar para a página inicial</a>
</body>
